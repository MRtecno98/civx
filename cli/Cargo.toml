[package]
name = "civx-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "civx"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
civx = { path = "..", version = "0.1.4", features = ["clap", "oauth"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
itertools = "0.15.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "cli"] }
oauth2 = "5.0.0"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
super-table = "1.1.1"
text_io = "0.1.13"
tokio = { version = "1.53.1", features = ["full"] }
