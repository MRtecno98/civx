[package]
name = "civx-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "civx"
path = "src/main.rs"

[dependencies]
civx = { path = "..", version = "0.1.3", features = ["clap"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
itertools = "0.15.0"
super-table = "1.1.1"
tokio = { version = "1.53.1", features = ["full"] }
