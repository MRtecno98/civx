[package]
name = "civx"
version = "0.1.1"
license = "MIT"
description = "A Rust client for the new CivitAI site API."
repository = "https://github.com/MRtecno98/civx"
keywords = ["civitai", "api", "ai", "client"]
categories = ["api-bindings", "artificial-intelligence"]
readme = "README.md"
edition = "2024"
build = "build.rs"
exclude = [
	"tests/",
	".github/",
	".vscode/",
	".gitignore"
]

[features]
enums = []
network-tests = []

[dependencies]
bitmask-enum = "2.2.5"
blake3 = "1.8.6"
bon = "3.9.3"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["cookies", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_plain = "1.0.2"
serde_url_params = "0.2.1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "net"] }
tokio-util = "0.7.19"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
include_optional = "1.1.1"
serde_test = "1.0.177"
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"

[build-dependencies]
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.3"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["cookies", "json"] }
serde_json = "1.0.151"
itertools = "0.15.0"
cargo-emit = "0.2.1"
